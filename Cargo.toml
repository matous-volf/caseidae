[package]
name = "caseidae"
version = "1.0.2"
description = "Convenient converters between letter casings of Rust identifiers."
keywords = ["casing", "case", "naming", "ident", "identifier"]
categories = [
    "development-tools",
    "development-tools::procedural-macro-helpers",
    "rust-patterns",
    "text-processing",
    "value-formatting",
]
repository = "https://codeberg.org/matous-volf/caseidae"
license = "AGPL-3.0-only"
readme = "readme.md"
edition = "2024"
include = ["/src", "/examples", "/tests"]

[dependencies]
convert_case = { version = "0.11.0", default-features = false }
convert_case_extras = "0.2.0"
proc-macro2 = { version = "1.0.106", default-features = false, optional = true }
syn = { version = "3.0.0", default-features = false, optional = true }

[dev-dependencies]
quote = { version = "1.0.46", default-features = false }
syn = { version = "3.0.0", default-features = false, features = ["printing"] }

[features]
default = ["syn"]
syn = ["dep:syn", "dep:proc-macro2"]

[[example]]
name = "macro"
required-features = ["syn"]

[lints.rust]
unsafe_code = "forbid"
